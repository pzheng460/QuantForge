[project]
name = "quantforge"
version = "0.2.36"
description = "fastest python trading bot"
authors = [
    {name = "River-Shi",email = "nachuan.shi.quant@gmail.com"}
]
license = {text = "MIT LICENSE"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy (>=1.26.4,<2.2.1)",
    "ccxt>=4.5.22",
    "click>=8.1.0",
    "fastapi>=0.117.1",
    "pydantic>=2.11",
    "uvicorn>=0.36.0",
    "requests>=2.32",
    "dynaconf>=3.2.12",
    "redis>=5.0",
]

[project.scripts]
quantforge = "quantforge.cli.main:quantforge"
quantforge-cli = "quantforge.cli.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.10",
]
